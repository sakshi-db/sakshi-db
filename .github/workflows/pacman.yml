name: Generate Arcade Contribution Graph

on:
  schedule:
    # Runs automatically every 24 hours
    - cron: "0 0 * * *"
  workflow_dispatch: # Allows you to run it manually whenever you want
  push:
    branches:
      - main
   
jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # Generates the Pac-Man contribution graph SVGs
      - name: generate contribution graph SVGs
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: sakshi-db
          games: 'pacman' # You can also add 'breakout' if desired (e.g., 'pacman,breakout')
          hide_month_labels: 'false'

          # Deploys the generated images to an isolated output branch
      - name: push SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
